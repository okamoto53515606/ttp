name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: 依存をインストール
        run: uv sync

      - name: スモークチェック
        run: uv run python scripts/smoke_check.py

      - name: exe と zip をビルド
        run: uv run python build.py

      - name: GitHub Release を作成
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ttp-*.zip
          generate_release_notes: true
