name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
          enable-cache: true

      - name: 既存リリースの確認
        id: existing
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "リリース $GITHUB_REF_NAME は既に存在するためスキップします"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 依存をインストール
        if: steps.existing.outputs.found == 'false'
        run: uv sync

      - name: Python バージョンの確認
        if: steps.existing.outputs.found == 'false'
        run: uv run python -VV

      - name: スモークチェック
        if: steps.existing.outputs.found == 'false'
        run: uv run python scripts/smoke_check.py

      - name: 依存の脆弱性チェック
        if: steps.existing.outputs.found == 'false'
        run: |
          uv export --no-dev --no-emit-project --no-hashes -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt

      - name: exe と zip をビルド
        if: steps.existing.outputs.found == 'false'
        run: uv run python build.py

      - name: GitHub Release を作成
        if: steps.existing.outputs.found == 'false'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ttp-*.zip
          generate_release_notes: true
