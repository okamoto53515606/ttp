name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: 依存をインストール
        run: uv sync
      - name: Python バージョンの確認
        run: uv run python -VV
      - name: スモークチェック
        run: uv run python scripts/smoke_check.py

      - name: 依存の脆弱性チェック
        run: |
          uv export --no-dev --no-emit-project --no-hashes -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt
