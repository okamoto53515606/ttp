AWSTemplateFormatVersion: "2010-09-09"
Description: >
  TTP LP (ttpilot.okamomedia.tokyo) — S3 + CloudFront + OAC。
  静的サイト専用。CSP を含むセキュリティヘッダーを付与する。

Parameters:
  DomainName:
    Type: String
    Default: ttpilot.okamomedia.tokyo
    Description: LP のホスト名（CloudFront の CNAME と証明書の SAN に使用）

  AcmCertificateArn:
    Type: String
    Default: ""
    Description: >
      us-east-1 で発行した ACM 証明書の ARN。CloudFront 用の証明書は
      us-east-1 にしか置けないため、このスタックとは別に発行する必要がある。
      EnableCustomDomain=false のときは不要。

  EnableCustomDomain:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >
      カスタムドメイン（DomainName）と ACM 証明書を紐づけるか。
      証明書が ISSUED になる前に false で作成し、発行後に true で更新できる。

  HostedZoneId:
    Type: String
    Description: okamomedia.tokyo の Route53 ホストゾーン ID
    Default: ""

  CreateDnsRecord:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Route53 の A レコード（エイリアス）を作成するか

Resources:
  # ---------------------------------------------------------------- S3
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "ttpilot-lp-${AWS::AccountId}-${AWS::Region}"
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SiteBucket.Arn
              - !Sub "${SiteBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"
          - Sid: AllowCloudFrontServicePrincipalReadOnly
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: "s3:GetObject"
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

  # ------------------------------------------------------- CloudFront OAC
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: S3 を非公開のまま CloudFront からのみ読む
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # -------------------------------------------------- Cache policies
  CachePolicyHtml:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-html"
        Comment: HTML は 60 秒だけキャッシュする（デプロイ時に無効化する）
        MinTTL: 60
        DefaultTTL: 60
        MaxTTL: 300
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  CachePolicyAssets:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Sub "${AWS::StackName}-assets"
        Comment: 静的アセットは1年キャッシュ
        MinTTL: 0
        DefaultTTL: 31536000
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  # --------------------------------------------- Security headers (CSP)
  ResponseHeadersPolicy:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security-headers"
        Comment: CSP ほかセキュリティヘッダー
        SecurityHeadersConfig:
          # CSP は「セキュリティヘッダー」扱いのため、CustomHeaders では設定できない
          ContentSecurityPolicy:
            ContentSecurityPolicy: >-
              default-src 'none';
              script-src 'none';
              style-src 'self';
              img-src 'self';
              font-src 'self';
              connect-src 'none';
              media-src 'none';
              object-src 'none';
              frame-src 'none';
              worker-src 'none';
              manifest-src 'none';
              form-action 'none';
              frame-ancestors 'none';
              base-uri 'none';
              upgrade-insecure-requests
            Override: true
          ContentTypeOptions:
            Override: true
          FrameOptions:
            FrameOption: DENY
            Override: true
          ReferrerPolicy:
            ReferrerPolicy: no-referrer
            Override: true
          StrictTransportSecurity:
            AccessControlMaxAgeSec: 63072000
            IncludeSubdomains: true
            Preload: false
            Override: true
        CustomHeadersConfig:
          Items:
            - Header: Permissions-Policy
              Value: >-
                accelerometer=(), autoplay=(), camera=(), display-capture=(),
                encrypted-media=(), geolocation=(), gyroscope=(), magnetometer=(),
                microphone=(), midi=(), payment=(), picture-in-picture=(),
                publickey-credentials-get=(), screen-wake-lock=(), usb=(),
                xr-spatial-tracking=()
              Override: true
            - Header: Cross-Origin-Opener-Policy
              Value: same-origin
              Override: true
            - Header: Cross-Origin-Resource-Policy
              Value: same-origin
              Override: true
            - Header: Cross-Origin-Embedder-Policy
              Value: require-corp
              Override: true

  # ------------------------------------------------------ URI rewriting
  # ディレクトリ URL を index.html に解決する（S3 の静的サイトホスティングは使わない）
  UriRewriteFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-uri-rewrite"
      AutoPublish: true
      FunctionConfig:
        Comment: /guide/macro/ -> /guide/macro/index.html
        Runtime: cloudfront-js-2.0
      FunctionCode: |
        function handler(event) {
          var request = event.request;
          var uri = request.uri;
          var last = uri.lastIndexOf('/');
          if (last === uri.length - 1) {
            request.uri = uri + 'index.html';
          } else if (uri.lastIndexOf('.') < last) {
            request.uri = uri + '/index.html';
          }
          return request;
        }

  # --------------------------------------------------------- Distribution
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: !Sub "TTP LP (${DomainName})"
        Aliases:
          - !Ref DomainName
        DefaultRootObject: index.html
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_200
        Aliases: !If
          - CustomDomainCondition
          - [!Ref DomainName]
          - !Ref "AWS::NoValue"
        ViewerCertificate: !If
          - CustomDomainCondition
          - AcmCertificateArn: !Ref AcmCertificateArn
            SslSupportMethod: sni-only
            MinimumProtocolVersion: TLSv1.2_2021
          - CloudFrontDefaultCertificate: true
        Origins:
          - Id: s3-origin
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: s3-origin
          ViewerProtocolPolicy: redirect-to-https
          Compress: true
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: !Ref CachePolicyHtml
          ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
          FunctionAssociations:
            - EventType: viewer-request
              FunctionARN: !GetAtt UriRewriteFunction.FunctionARN
        CacheBehaviors:
          - PathPattern: /assets/*
            TargetOriginId: s3-origin
            ViewerProtocolPolicy: redirect-to-https
            Compress: true
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: !Ref CachePolicyAssets
            ResponseHeadersPolicyId: !Ref ResponseHeadersPolicy
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html
            ErrorCachingMinTTL: 10

  # ------------------------------------------------------------- Route53
  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: CreateDnsRecordCondition
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt Distribution.DomainName
        HostedZoneId: Z2FDTNDATAQYW2

Conditions:
  CustomDomainCondition: !Equals [!Ref EnableCustomDomain, "true"]
  CreateDnsRecordCondition: !And
    - !Equals [!Ref CreateDnsRecord, "true"]
    - !Condition CustomDomainCondition

Outputs:
  BucketName:
    Description: デプロイ先の S3 バケット
    Value: !Ref SiteBucket
  DistributionId:
    Description: キャッシュ無効化に使うディストリビューション ID
    Value: !Ref Distribution
  DistributionDomainName:
    Description: CloudFront のドメイン名（DNS を自分で設定する場合はここへ CNAME）
    Value: !GetAtt Distribution.DomainName
  SiteUrl:
    Description: 公開 URL
    Value: !Sub "https://${DomainName}/"
